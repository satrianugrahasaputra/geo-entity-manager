services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-geo_entities}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geo} -d ${POSTGRES_DB:-geo_entities}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-geo_entities}?sslmode=disable
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  geo_pgdata:
